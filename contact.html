<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SYHTE1LZN2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SYHTE1LZN2');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | ルーレット</title>
    <meta name="description" content="ルーレットへのお問い合わせはこちらから。ご質問・ご要望をお待ちしております。">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #faf5ff 50%, #ecfeff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(236, 72, 153, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .required {
            color: #ec4899;
            margin-left: 0.25rem;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            color: #1f2937;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.1);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #ec4899;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .footer a {
            color: #ec4899;
            text-decoration: none;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .success-message i {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 1rem;
        }

        .success-message h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .success-message p {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .home-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> ルーレットに戻る
        </a>

        <div class="card">
            <div id="formContainer">
                <h1>お問い合わせ</h1>
                <p class="subtitle">ご質問・ご要望がございましたらお気軽にお送りください</p>

                <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="contactForm">
                    <input type="hidden" name="form-name" value="contact">
                    <input type="hidden" name="subject" value="ルーレット お問い合わせ">
                    <p style="display: none;">
                        <label>Don't fill this out if you're human: <input name="bot-field"></label>
                    </p>

                    <div class="form-group">
                        <label for="category">お問い合わせ種別<span class="required">*</span></label>
                        <select name="category" id="category" required>
                            <option value="">選択してください</option>
                            <option value="質問">ご質問</option>
                            <option value="要望">ご要望・機能リクエスト</option>
                            <option value="不具合">不具合の報告</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">お名前<span class="required">*</span></label>
                        <input type="text" name="name" id="name" placeholder="山田 太郎" required>
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス<span class="required">*</span></label>
                        <input type="email" name="email" id="email" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">お問い合わせ内容<span class="required">*</span></label>
                        <textarea name="message" id="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane" style="margin-right: 0.5rem;"></i>送信する
                    </button>
                </form>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <h2>送信完了</h2>
                <p>お問い合わせありがとうございます。<br>内容を確認の上、ご返信いたします。</p>
                <a href="index.html" class="home-btn">ホームに戻る</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 ルーレット. All rights reserved.</p>
        <p>
            <a href="index.html">ホーム</a> |
            <a href="privacy.html">プライバシーポリシー</a> |
            <a href="terms.html">利用規約</a> |
            <a href="contact.html">お問い合わせ</a>
        </p>
    </footer>

    <script>
        // フォーム送信後の処理
        const form = document.getElementById('contactForm');
        const formContainer = document.getElementById('formContainer');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(form);

            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                formContainer.style.display = 'none';
                successMessage.style.display = 'block';
            })
            .catch((error) => {
                alert('送信中にエラーが発生しました。時間をおいて再度お試しください。');
            });
        });
    </script>
</body>
</html>
